name: NVIDIA GPU Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # Allow manual trigger

jobs:
  gpu-build:
    name: Build with NVIDIA GPU Support
    runs-on: [self-hosted, linux, gpu, nvidia]
    # For GitHub-hosted GPU runners (requires specific plan):
    # runs-on: ubuntu-latest-4-gpu
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up NVIDIA Container Toolkit
        run: |
          # Ensure nvidia-container-toolkit is installed
          which nvidia-container-toolkit || {
            curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
            curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
              sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
              sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
            sudo apt-get update
            sudo apt-get install -y nvidia-container-toolkit
            sudo nvidia-ctk runtime configure --runtime=docker
            sudo systemctl restart docker
          }
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build GPU-enabled backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:gpu-${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:gpu-latest
          build-args: |
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Test GPU image
        run: |
          docker run --rm --gpus all ghcr.io/${{ github.repository }}/backend:gpu-${{ github.sha }} \
            python -c "import torch; print('CUDA:', torch.cuda.is_available()); print('GPU:', torch.cuda.get_device_name(0))"
