[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentswarm-backend"
version = "1.0.0"
description = "Agent Swarms Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi<0.111.0",
    "python-multipart==0.0.9",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.2.1",
    "uvicorn==0.29.0",
    "supabase>=2.31.0",
    "httpx==0.27.0",
    "redis==5.0.4",
    "chromadb>=0.4.24,<0.5.0",
    "numpy<2",
    "openai>=1.57.0,<2.0.0",
    "litellm>=1.44.0,<1.60.0",
    "firebase-admin==6.5.0",
    "psycopg[binary,pool]==3.1.18",
    "watchdog==4.0.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "apscheduler==3.10.4",
    "croniter==2.0.5",
    "groq>=0.5.0,<1.0.0",
    "elevenlabs>=1.0.0",
    "tiktoken>=0.7.0,<0.8.0",
    "websockets>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "crewai==0.41.1",
    "black==24.4.2",
    "ruff==0.4.3",
]
gpu = [
    "torch>=2.0.0",
    "sentence-transformers==2.7.0",
    "spacy>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
